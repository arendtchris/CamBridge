<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#3fb950"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrGy" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#8b949e"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#f85149"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="960" height="620" fill="#0d1117"/>

  <text x="480" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">
    CamBridge Wiring – ESP32-C3 Super Mini ↔ Flight Controller
  </text>
  <text x="480" y="54" text-anchor="middle" fill="#8b949e" font-size="12">
    MSP @ 115200 · TX/RX crossed · GND · 5V
  </text>

  <!-- ESP -->
  <g filter="url(#sh)">
    <rect x="48" y="90" width="320" height="360" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  </g>
  <rect x="130" y="155" width="160" height="190" rx="10" fill="#1a1a1a" stroke="#c9a227" stroke-width="2"/>
  <circle cx="210" cy="230" r="28" fill="none" stroke="#e6edf3" stroke-width="2.5"/>
  <circle cx="210" cy="230" r="10" fill="#e6edf3"/>
  <text x="210" y="290" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="700">ESP32-C3</text>
  <text x="210" y="306" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="700">Super Mini</text>

  <text x="208" y="120" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="700">ESP32-C3 Super Mini</text>
  <text x="208" y="140" text-anchor="middle" fill="#8b949e" font-size="11">CamBridge / GoPro CamBridge</text>

  <circle cx="290" cy="290" r="8" fill="#238636" stroke="#3fb950" stroke-width="1.5"/>
  <text x="305" y="286" fill="#3fb950" font-size="13" font-weight="700">GPIO20</text>
  <text x="305" y="302" fill="#8b949e" font-size="11">RX · Pin 20</text>

  <circle cx="290" cy="340" r="8" fill="#1f6feb" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="305" y="336" fill="#58a6ff" font-size="13" font-weight="700">GPIO21</text>
  <text x="305" y="352" fill="#8b949e" font-size="11">TX · Pin 21</text>

  <circle cx="130" cy="380" r="8" fill="#6e7681" stroke="#8b949e" stroke-width="1.5"/>
  <text x="145" y="376" fill="#c9d1d9" font-size="13" font-weight="700">GND</text>
  <text x="145" y="392" fill="#8b949e" font-size="11">ground</text>

  <circle cx="130" cy="420" r="8" fill="#da3633" stroke="#f85149" stroke-width="1.5"/>
  <text x="145" y="416" fill="#c9d1d9" font-size="13" font-weight="700">5V</text>
  <text x="145" y="432" fill="#8b949e" font-size="11">power</text>

  <!-- FC -->
  <g filter="url(#sh)">
    <rect x="592" y="90" width="320" height="360" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  </g>
  <text x="752" y="120" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="700">Flight Controller</text>
  <text x="752" y="140" text-anchor="middle" fill="#8b949e" font-size="11">Betaflight · free UART (e.g. UART2)</text>

  <circle cx="620" cy="290" r="8" fill="#1f6feb" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="640" y="286" fill="#c9d1d9" font-size="13" font-weight="700">RX</text>
  <text x="640" y="302" fill="#8b949e" font-size="11">MSP in</text>

  <circle cx="620" cy="340" r="8" fill="#238636" stroke="#3fb950" stroke-width="1.5"/>
  <text x="640" y="336" fill="#c9d1d9" font-size="13" font-weight="700">TX</text>
  <text x="640" y="352" fill="#8b949e" font-size="11">MSP out</text>

  <circle cx="620" cy="380" r="8" fill="#6e7681" stroke="#8b949e" stroke-width="1.5"/>
  <text x="640" y="376" fill="#c9d1d9" font-size="13" font-weight="700">GND</text>
  <text x="640" y="392" fill="#8b949e" font-size="11">ground</text>

  <circle cx="620" cy="420" r="8" fill="#da3633" stroke="#f85149" stroke-width="1.5"/>
  <text x="640" y="416" fill="#c9d1d9" font-size="13" font-weight="700">5V</text>
  <text x="640" y="432" fill="#8b949e" font-size="11">power</text>

  <!-- wires -->
  <path d="M298,340 C430,340 500,290 612,290" fill="none" stroke="#58a6ff" stroke-width="3.5" marker-end="url(#arrB)"/>
  <text x="470" y="300" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="700">GPIO21 TX  →  FC RX</text>

  <path d="M298,290 C430,290 500,340 612,340" fill="none" stroke="#3fb950" stroke-width="3.5" marker-end="url(#arrG)"/>
  <text x="470" y="370" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="700">GPIO20 RX  ←  FC TX</text>

  <path d="M138,380 C400,380 480,380 612,380" fill="none" stroke="#8b949e" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrGy)"/>
  <text x="470" y="370" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="600" opacity="0">GND</text>
  <text x="470" y="398" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="600">GND — GND</text>

  <path d="M138,420 C400,420 480,420 612,420" fill="none" stroke="#f85149" stroke-width="3" marker-end="url(#arrR)"/>
  <text x="470" y="440" text-anchor="middle" fill="#f85149" font-size="11" font-weight="600">5V — 5V</text>

  <!-- legend -->
  <rect x="48" y="470" width="864" height="130" rx="12" fill="#161b22" stroke="#30363d"/>

  <text x="68" y="498" fill="#e6edf3" font-size="13" font-weight="700">Connection table</text>
  <text x="68" y="520" fill="#8b949e" font-size="12">ESP GPIO21 (TX) → FC RX</text>
  <text x="68" y="538" fill="#8b949e" font-size="12">ESP GPIO20 (RX) ← FC TX</text>
  <text x="68" y="556" fill="#8b949e" font-size="12">ESP GND — FC GND</text>
  <text x="68" y="574" fill="#8b949e" font-size="12">ESP 5V — FC 5V</text>

  <text x="360" y="498" fill="#e6edf3" font-size="13" font-weight="700">Betaflight</text>
  <text x="360" y="520" fill="#8b949e" font-size="12">Ports tab → choose UART → set MSP</text>
  <text x="360" y="538" fill="#8b949e" font-size="12">Baudrate 115200</text>
  <text x="360" y="556" fill="#8b949e" font-size="12">OSD: enable Custom Message 1–4</text>

  <text x="640" y="498" fill="#e6edf3" font-size="13" font-weight="700">Notes</text>
  <text x="640" y="520" fill="#8b949e" font-size="12">Always cross TX/RX</text>
  <text x="640" y="538" fill="#8b949e" font-size="12">Shared GND required</text>
  <text x="640" y="556" fill="#8b949e" font-size="12">USB-C = flash / license only</text>
</svg>
